# EKS: attach the IAM roles to pods with IAM Roles for Service Accounts (IRSA).
# Add `serviceAccountName: imgframe-api` / `imgframe-worker` to the api and worker
# Deployments, remove the s3-credentials secret and S3_ENDPOINT, and set
# S3_SSE=aws:kms, S3_KMS_KEY_ID and S3_MANAGE_BUCKET=0 in the ConfigMap.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: imgframe-api
  namespace: imgframe
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/imgframe-api
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: imgframe-worker
  namespace: imgframe
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/imgframe-worker
