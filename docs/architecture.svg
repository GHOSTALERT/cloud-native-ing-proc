<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 660" width="1280" height="660" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
  </defs>
  <rect width="1280" height="660" fill="#ffffff"/>

  <!-- cluster -->
  <rect x="215" y="20" width="1045" height="620" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="8 6" stroke-width="2"/>
  <text x="235" y="48" font-size="16" font-weight="bold" fill="#475569">Kubernetes cluster (Minikube) · namespace imgframe · Docker image imgframe:latest</text>

  <!-- client -->
  <rect x="20" y="255" width="165" height="110" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="102" y="285" text-anchor="middle" font-size="15" font-weight="bold" fill="#0c4a6e">Client</text>
  <text x="102" y="307" text-anchor="middle" font-size="12" fill="#0c4a6e">Web UI / curl /</text>
  <text x="102" y="324" text-anchor="middle" font-size="12" fill="#0c4a6e">benchmark script</text>
  <text x="102" y="346" text-anchor="middle" font-size="11" fill="#0369a1">NodePort :30080</text>

  <!-- API -->
  <rect x="250" y="200" width="240" height="220" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="370" y="228" text-anchor="middle" font-size="15" font-weight="bold" fill="#4c1d95">API pod (FastAPI)</text>
  <g font-size="12.5" fill="#3b0764">
    <text x="266" y="256">① Upload image</text>
    <text x="266" y="279">② Partition into tiles</text>
    <text x="284" y="296" font-size="11.5" fill="#6d28d9">512 px + halo (overlap)</text>
    <text x="266" y="319">③ Schedule: enqueue 1 task/tile</text>
    <text x="266" y="342">Job status · timings · metrics</text>
    <text x="266" y="365">Reaper: requeue expired leases</text>
    <text x="266" y="388">⑦ Serve final image (PNG/JPG)</text>
  </g>

  <!-- Redis -->
  <rect x="560" y="150" width="270" height="290" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="695" y="178" text-anchor="middle" font-size="15" font-weight="bold" fill="#7f1d1d">Redis (task queue + store)</text>
  <g font-size="12" fill="#7f1d1d" font-family="DejaVu Sans Mono, monospace">
    <text x="576" y="208">queue:pending     LIST</text>
    <text x="576" y="230">queue:processing  LIST</text>
    <text x="576" y="252">queue:leases      ZSET</text>
    <text x="576" y="274">queue:attempts    HASH</text>
    <text x="576" y="304">job:{id}          HASH</text>
    <text x="576" y="326">job:{id}:tiles    HASH</text>
    <text x="576" y="348">job:{id}:results  HASH</text>
    <text x="576" y="370">job:{id}:result   STRING</text>
  </g>
  <text x="576" y="400" font-size="11.5" fill="#991b1b">Atomic Lua scripts: claim · complete ·</text>
  <text x="576" y="418" font-size="11.5" fill="#991b1b">reap · release (exactly-once counting)</text>

  <!-- workers -->
  <rect x="930" y="96" width="300" height="300" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2" transform="translate(16,-16)" opacity="0.45"/>
  <rect x="930" y="96" width="300" height="300" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2" transform="translate(8,-8)" opacity="0.7"/>
  <rect x="930" y="96" width="300" height="300" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1080" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#14532d">Worker pods × N</text>
  <g font-size="12.5" fill="#14532d">
    <text x="946" y="154">④ Claim task (lease 10 s)</text>
    <text x="946" y="177">⑤ Process tile with OpenCV</text>
    <text x="964" y="195" font-size="11.5" fill="#15803d">canny · sobel · blur · bilateral …</text>
    <text x="946" y="218">    store result, count progress</text>
    <text x="946" y="241">Heartbeat extends the lease</text>
    <text x="946" y="264">SIGTERM → release in-flight tile</text>
    <text x="946" y="294" font-weight="bold">⑥ Worker finishing the last tile:</text>
    <text x="964" y="314">aggregate results, crop halos,</text>
    <text x="964" y="332">reconstruct the full image</text>
    <text x="946" y="362" font-size="11.5" fill="#15803d">Optional process pool per pod</text>
    <text x="946" y="380" font-size="11.5" fill="#15803d">(WORKER_PROCS)</text>
  </g>

  <!-- autoscaler -->
  <rect x="560" y="490" width="270" height="110" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="695" y="518" text-anchor="middle" font-size="15" font-weight="bold" fill="#7c2d12">Queue autoscaler</text>
  <text x="576" y="545" font-size="12.5" fill="#7c2d12">replicas = ceil(queue depth / 16)</text>
  <text x="576" y="566" font-size="12.5" fill="#7c2d12">clamped to [1, 8], 30 s cool-down</text>
  <text x="576" y="587" font-size="11.5" fill="#9a3412">RBAC: patch deployments/scale</text>

  <!-- k8s self-healing note -->
  <rect x="930" y="470" width="300" height="130" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="1080" y="497" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">Fault tolerance</text>
  <g font-size="12" fill="#334155">
    <text x="946" y="522">Pod dies → lease expires → reaper</text>
    <text x="946" y="541">requeues tile (max 3 attempts)</text>
    <text x="946" y="563">Deployment recreates the pod</text>
    <text x="946" y="585">Duplicate results ignored (idempotent)</text>
  </g>

  <!-- arrows -->
  <line x1="185" y1="292" x2="248" y2="292" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="190" y="284" font-size="11" fill="#334155">POST /jobs</text>
  <line x1="248" y1="332" x2="187" y2="332" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="190" y="350" font-size="11" fill="#334155">status/result</text>

  <line x1="490" y1="270" x2="558" y2="270" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="497" y="262" font-size="11" fill="#334155">tiles +</text>
  <text x="497" y="288" font-size="11" fill="#334155">tasks</text>
  <line x1="558" y1="360" x2="492" y2="360" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="497" y="378" font-size="11" fill="#334155">result</text>

  <line x1="830" y1="215" x2="928" y2="215" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="842" y="207" font-size="11" fill="#334155">claim tile</text>
  <line x1="928" y1="300" x2="832" y2="300" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="842" y="292" font-size="11" fill="#334155">result tile</text>
  <text x="842" y="318" font-size="11" fill="#334155">final image</text>

  <line x1="695" y1="488" x2="695" y2="442" stroke="#c2410c" stroke-width="2" marker-end="url(#o)"/>
  <text x="702" y="470" font-size="11" fill="#c2410c">reads queue depth</text>
  <path d="M830,545 C900,545 900,420 975,398" fill="none" stroke="#c2410c" stroke-width="2" marker-end="url(#o)"/>
  <text x="850" y="470" font-size="11" fill="#c2410c">scale</text>
  <text x="850" y="484" font-size="11" fill="#c2410c">workers</text>
</svg>
