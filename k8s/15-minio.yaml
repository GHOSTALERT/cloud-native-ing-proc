# S3-compatible object store for tiles, results and final images.
# S3_PUBLIC_ENDPOINT on the api must point at the NodePort for presigned downloads:
#   kubectl -n imgframe set env deploy/api S3_PUBLIC_ENDPOINT=http://$(minikube ip):30900
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: imgframe
spec:
  replicas: 1
  selector:
    matchLabels: { app: minio }
  template:
    metadata:
      labels: { app: minio }
    spec:
      containers:
        - name: minio
          image: cgr.dev/chainguard/minio:latest
          args: ["server", "/data", "--address", ":9000"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom: { secretKeyRef: { name: s3-credentials, key: AWS_ACCESS_KEY_ID } }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: s3-credentials, key: AWS_SECRET_ACCESS_KEY } }
            - { name: MINIO_BROWSER, value: "off" }
          ports: [{ containerPort: 9000 }]
          volumeMounts: [{ name: data, mountPath: /data }]
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { memory: 1Gi }
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: 9000 }
            periodSeconds: 3
      volumes:
        - name: data
          emptyDir: { sizeLimit: 8Gi }      # demo only; use a PVC (or real S3) to keep data
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: imgframe
spec:
  type: NodePort
  selector: { app: minio }
  ports: [{ port: 9000, targetPort: 9000, nodePort: 30900 }]
