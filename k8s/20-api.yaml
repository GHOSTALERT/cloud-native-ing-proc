apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: imgframe
spec:
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: imgframe:latest
          imagePullPolicy: Never          # built inside minikube's Docker (see README)
          envFrom: [{ configMapRef: { name: imgframe-config } }]
          ports: [{ containerPort: 8000 }]
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits: { cpu: "2", memory: 3Gi }
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: imgframe
spec:
  type: NodePort
  selector: { app: api }
  ports: [{ port: 8000, targetPort: 8000, nodePort: 30080 }]
