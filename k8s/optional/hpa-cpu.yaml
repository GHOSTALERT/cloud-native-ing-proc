# Baseline 1 for the autoscaler comparison: CPU-based HPA (Kubernetes default behaviour,
# 70 % CPU target). Needs metrics-server (scripts/install_k8s_addons.sh).
# Scale-down window set to 30 s (default 300 s) to match the other scalers.
# Do not run together with 40-autoscaler.yaml; use scripts/k8s_scaler.sh hpa.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker-cpu
  namespace: imgframe
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: worker }
  minReplicas: 1
  maxReplicas: 8
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
  behavior:
    scaleDown: { stabilizationWindowSeconds: 30 }
