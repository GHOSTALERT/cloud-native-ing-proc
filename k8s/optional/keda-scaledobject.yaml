# Baseline 2 for the autoscaler comparison: KEDA scaling on Redis queue length
# (16 pending tasks per worker, the same rule as the original autoscaler).
# Polling 3 s and cooldown 30 s (defaults 30 s / 300 s) to match the other scalers.
# Needs KEDA (scripts/install_k8s_addons.sh). Use scripts/k8s_scaler.sh keda.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker-queue
  namespace: imgframe
spec:
  scaleTargetRef: { name: worker }
  minReplicaCount: 1
  maxReplicaCount: 8
  pollingInterval: 3
  cooldownPeriod: 30
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown: { stabilizationWindowSeconds: 30 }
  triggers:
    - type: redis
      metadata:
        address: redis.imgframe.svc.cluster.local:6379
        listName: imgframe:queue:pending
        listLength: "16"
